<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <form action="" class="col-6 p-4 mt-5 border needs-validation" novalidate>
        <div class="row">
            <div class="col-sm">
                <div class="form-floating mb-3" >
                    <input type="text" class="form-control" id="floatingInput" placeholder="Meno" required>
                    <label for="floatingInput">Meno</label>
                    <div class="invalid-feedback">
                        Prosím zadaj meno.
                    </div>
                </div>
            </div>
       
            <div class="col-sm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput1" placeholder="Priezvisko" required>
                    <label for="floatingInput1">Priezvisko</label>
                    <div class="invalid-feedback">
                        Prosím zadaj priezvisko.
                    </div>
                </div>
            </div>
        </div>
      
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput2" placeholder="Email" required>
            <label for="floatingInput2">Emailová adresa</label>
            <div class="invalid-feedback">
                Prosím zadaj email v správnom tvare.
            </div>
        </div>
          
       
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingInput3" placeholder="Heslo" minlength = 6 required>
            <label for="floatingInput3" >Heslo</label>
            <div class="invalid-feedback">
                Heslo musí obsahovať aspoň 6 znakov.
            </div>
        </div>
        
        <div class="form-floating">
            <select class="form-select" id="floatingSelect" aria-label="Floating label select" required>
                <option selected disabled value="">Krajina</option>
                <option value="1" >Slovensko</option>
                <option value="2" >Česko</option>
                <option value="3" >Rakúsko</option>
            </select>
            <label for="floatingSelect">Vyber krajinu: </label>
            <div class="invalid-feedback">
                Musí byť vybratá krajina.
            </div>
        </div>
        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" value="" id="checkDefault" required>
            <label class="form-check-label" for="checkDefault">
                Súhlasím s podmienkami
            </label>
            <div class="invalid-feedback">
                Toto pole je povinné.
            </div>
        </div>
        <div class="col-12 mt-3">
            <button class="btn btn-primary" type="submit">Odoslať</button>
        </div>
    </form>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict'

  var forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.prototype.slice.call(forms)
    .forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }

        form.classList.add('was-validated')
      }, false)
    })
})()
</script>
</html>
